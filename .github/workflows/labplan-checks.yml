name: LabPlan checks
on:
  push:
    branches: [main]
    paths: ['lab-build-plan/**', '.github/workflows/labplan-checks.yml']
  pull_request:
    paths: ['lab-build-plan/**', '.github/workflows/labplan-checks.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-build-plan
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm run check
      - run: npm test
